# Used only for authoring new revisions, e.g.
#   uv run alembic revision --autogenerate -m "describe change"
# The bot itself runs migrations programmatically on start-up (plan_bot.db.migrate).
[alembic]
script_location = src/plan_bot/migrations
prepend_sys_path = src
sqlalchemy.url = sqlite+aiosqlite:///./data/plan-bot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
