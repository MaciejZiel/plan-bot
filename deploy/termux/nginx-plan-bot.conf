# Include inside a `server { ... }` block, e.g.
#   include /data/data/com.termux/files/usr/etc/nginx/snippets/plan-bot.conf;
#
# The bot itself needs no inbound traffic (Telegram long polling). Only the health
# endpoint is exposed, and only the single path /plan-bot/healthz.
location = /plan-bot/healthz {
    proxy_pass http://127.0.0.1:8091/plan-bot/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
    access_log off;
}
